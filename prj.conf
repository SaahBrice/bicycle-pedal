#3. Minimize RAM Retention
#This is where the nRF54L15 diverges sharply from nRF52. RAM is banked into multiple sections (the exact layout depends on your linker configuration, but think 32-64KB granularity). Each retained bank costs roughly 0.3-0.5 µA in System ON Sleep. If your application only needs 32KB of retained state, powering all 256KB is wasteful.

#In your devicetree overlay, configure which RAM sections stay retained during sleep. The Zephyr PM subsystem respects these settings when entering PM_STATE_SUSPEND_TO_RAM. You’ll need to ensure your stack, heap, and any persistent buffers land in the retained sections via linker script adjustments.

#Measured delta: ~120 µA → ~80 µA (powering down 3 of 4 banks).

# Review: the RAM-current figures above are unverified, not project measurements.
# Neither RAM retention nor suspend-to-RAM is enabled. Use prj_power.conf or
# prj_compare.conf for the controlled measurement builds.
